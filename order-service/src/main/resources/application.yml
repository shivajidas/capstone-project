    token-uri: https://integrator-4292712.okta.com/oauth2/default/v1/token
    client-id: 0oa10pm9l4qx3Gblu698
    client-secret: ofmDMsWoRPUbHKrys4VgicRnIfvCs68r4H5CGJWdkpuuzsXg1A8U1qOOdTmxMsIf

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      productService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.RestClientException
          - java.net.ConnectException
          - java.io.IOException
          - com.order.order_service.exceptions.ApplicationUnavailableException

# Actuator endpoints for monitoring circuit breaker
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,info,metrics
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      defaults:
        enabled: true
      show-details: always