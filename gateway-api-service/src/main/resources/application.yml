server:
  port: 8080
spring:
  application:
    name: gateway-api-service
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: "http://localhost:9093"
          predicates:
            - Path=/api/product/**
          #filters:
            #- name: RequestRateLimiter
            #  args:
            #    key-resolver: '#{@userKeyResolver}'
            #    redis-rate-limiter.replenishRate: 2
            #    redis-rate-limiter.burstCapacity: 2
          order: 11
        - id: customer-service
          uri: "http://localhost:9091"
          predicates:
            - Path=/api/customer/**
          order: 12
        - id: order-service
          uri: "http://localhost:9094"
          predicates:
            - Path=/api/orders/**
          order: 13